[project]
name = "lab1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.6",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
lab1 = "lab1:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
